<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Recuperar contraseña - Health Tramiter</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/estilo.css" />
  </head>
  <body>
    <section class="page-auth">
      <main class="auth-shell">
        <div class="auth-header">
          <div class="logo">
            <img src="../imagenes/Logo.png" alt="Health Tramiter" />
          </div>
          <h1 class="title-h1">Health Tramiter</h1>
        </div>

        <div class="auth-card recuperarcontraseña-box">
          <h3 class="title-h3">Recuperar contraseña</h3>
          <p class="subtitle">
            Ingresa tu correo electrónico y te enviaremos las instrucciones para
            restablecer tu contraseña.
          </p>

          <form id="formRecuperar" class="form-recuperar">
            <div class="form-group">
              <label for="correo">Correo electrónico</label>
              <div class="input-icon-wrap">
                <span class="material-symbols-outlined">mail</span>
                <input
                  id="correo"
                  type="email"
                  placeholder="ejemplo@correo.com"
                  required
                />
              </div>
            </div>

            <button type="submit">
              <span class="material-symbols-outlined">send</span>
              Enviar 
            </button>
          </form>

          <div class="auth-footer">
            <a
              href="login.html"
              class="auth-back-link"
            >
              <span class="material-symbols-outlined icon-md"
                >arrow_back</span
              >
              Volver al inicio de sesión
            </a>
          </div>
        </div>

        <p class="page-footer">
          © 2024 Health Tramiter. Todos los derechos reservados.
        </p>
      </main>
    </section>

    <script src="../js/main.js" type="module"></script>
    <script src="../js/navegacion.js"></script>
  </body>
</html>
