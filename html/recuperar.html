<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Recuperar contraseña - Health Tramiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<section class="page-auth">
<main style="width:100%;max-width:28rem;">

<div class="auth-header">
<div class="auth-brand">
<span class="material-symbols-outlined">medical_services</span>
</div>
<h1 class="title-h1" style="font-size:1.35rem;">Health Tramiter</h1>
</div>

<div class="auth-card recuperarcontraseña-box">

<h3 class="title-h3">Recuperar contraseña</h3>
<p class="subtitle">Ingresa tu correo electrónico y te enviaremos las instrucciones para restablecer tu contraseña.</p>

<form id="formRecuperar" class="form-recuperar">

<div class="form-group">
<label for="correo">Correo electrónico</label>
<div class="input-icon-wrap">
<span class="material-symbols-outlined">mail</span>
<input id="correo" type="email" placeholder="ejemplo@correo.com" required>
</div>
</div>

<button type="submit">
<span class="material-symbols-outlined">send</span>
Enviar instrucciones
</button>

</form>

<div class="auth-footer">
<a href="login.html" style="display:inline-flex;align-items:center;gap:0.35rem;">
<span class="material-symbols-outlined" style="font-size:1.1rem;">arrow_back</span>
Volver al inicio de sesión
</a>
</div>

</div>

<p class="page-footer">© 2024 Health Tramiter. Todos los derechos reservados.</p>

</main>
</section>

<script src="../js/main.js" type="module"></script>
<script src="../js/navegacion.js"></script>
</body>
</html>
