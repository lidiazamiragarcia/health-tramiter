<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Crear trámite - Health Tramiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<section class="page-auth">
<div class="tramite-box">

<div class="logo">
<img src="../imagenes/Logo.png" alt="Health Tramiter">
</div>

<h3 class="title-h3">Creación de trámite</h3>
<p class="subtitle">Completa los datos para iniciar tu solicitud de salud</p>

<form id="formTramite" class="form-tramite">

<div class="highlight-box">
<label for="eps">
<span class="material-symbols-outlined">account_balance</span>
EPS / Entidad Responsable
</label>
<select id="eps" required>
<option value="">Seleccionar EPS o Entidad</option>
<option value="EPS Sura">EPS Sura</option>
<option value="Sanitas">Sanitas</option>
<option value="Compensar">Compensar</option>
<option value="Salud Total">Salud Total</option>
<option value="Nueva EPS">Nueva EPS</option>
</select>
<small>Asegúrate de seleccionar la entidad donde te encuentras afiliado actualmente.</small>
</div>

<div class="form-grid">

<div class="form-group">
<label for="tipoTramite">Tipo de trámite</label>
<select id="tipoTramite" required>
<option value="">Seleccionar</option>
<option value="Autorización médica">Autorización médica</option>
<option value="Solicitud de medicamentos">Solicitud de medicamentos</option>
<option value="Cita especialista">Cita especialista</option>
<option value="Reclamo / PQR">Reclamo / PQR</option>
</select>
</div>

<div class="form-group">
<label for="fechaTramite">Fecha del trámite</label>
<input id="fechaTramite" type="date">
</div>

<div class="form-group span-2">
<label for="descripcion">Descripción</label>
<textarea id="descripcion" placeholder="Describe detalladamente los detalles del trámite..." rows="4"></textarea>
</div>

<div class="form-group span-2">
<label>Soportes y documentos</label>
<div class="upload-zone">
<input type="file" id="archivoTramite" accept=".pdf,.jpg,.jpeg,.png">
<div class="upload-icon">
<span class="material-symbols-outlined">upload_file</span>
</div>
<p class="upload-title">Subir un archivo o arrastra y suelta</p>
<p class="text-helper upload-help">PDF, JPG, PNG hasta 10MB</p>
</div>
</div>

</div>

<div class="buttons-tramite">
<button type="submit">Crear trámite</button>
<button type="button" class="btn-cancelar">Cancelar</button>
</div>

</form>

<p class="page-footer">© 2024 Health Tramiter. Tu salud, nuestra prioridad.</p>

</div>
</section>

<script src="../js/main.js" type="module"></script>
<script src="../js/navegacion.js"></script>
</body>
</html>
