<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Subir documentos - Health Tramiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<section class="page-auth">
<div class="documentos-box">

<div class="logo">
<img src="../imagenes/Logo.png" alt="Health Tramiter">
</div>

<h3 class="title-h3">Subir documentos</h3>

<div class="success-message hidden" id="mensajeExito">
<span class="material-symbols-outlined">check_circle</span>
Documento cargado exitosamente
</div>

<form id="formDocumentos" class="form-documentos">

<div class="form-group">
<label for="tipoDocumento">Tipo de documento</label>
<select id="tipoDocumento" required>
<option value="">Seleccionar</option>
<option value="Autorización">Autorización</option>
<option value="Historia Clínica">Historia Clínica</option>
<option value="Identificación">Identificación</option>
<option value="Orden Médica">Orden Médica</option>
</select>
</div>

<div class="form-group">
<label>Seleccionar archivo</label>
<div class="upload-zone">
<input type="file" id="archivo" accept=".pdf,.jpg,.jpeg,.png">
<div class="upload-icon">
<span class="material-symbols-outlined">cloud_upload</span>
</div>
<p class="upload-title">Haz clic o arrastra un archivo</p>
<p class="text-helper upload-help">Elige un documento desde tu dispositivo</p>
<span class="file-name"></span>
</div>
<small class="file-help">
<span class="material-symbols-outlined icon-sm">info</span>
Formatos permitidos: PDF, JPG, PNG. Tamaño máximo: 5MB.
</small>
</div>

<div class="buttons-documentos">
<button type="submit">Subir documento</button>
<button type="button" class="btn-cancelar">Cancelar</button>
</div>

</form>

</div>
</section>

<script src="../js/main.js" type="module"></script>
<script src="../js/navegacion.js"></script>
</body>
</html>
