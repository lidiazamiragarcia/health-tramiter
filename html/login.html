<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizar datos - Health Tramiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
  <body>

    <section class="page-auth">
      <main class="auth-shell">
        <div class="auth-header">
          <div class="logo">
            <img src="../imagenes/Logo.png" alt="Health Tramiter" />
          </div>
          
          <h1 class="title-h1">Health Tramiter</h1>
          <p class="subtitle">Tu salud, tus documentos</p>
        </div>

        <div class="auth-card login-box">
          <h3 class="title-h3">Inicio de sesión</h3>

          <form id="formlogin" method="post" action="#">
            <div class="form-group">
              <label for="user">Correo electrónico</label>
              <div class="input-icon-wrap">
                <span class="material-symbols-outlined">mail</span>
                <input
                  id="user"
                  type="email"
                  placeholder="ejemplo@correo.com"
                  required
                />
              </div>
            </div>

            <div class="form-group">
              <div class="auth-form-row">
                <label for="password">Contraseña</label>
                <a
                  href="recuperar.html"
                  class="auth-link"
                  >¿Olvidaste tu contraseña?</a
                >
              </div>
              <div class="input-icon-wrap">
                <span class="material-symbols-outlined">lock</span>
                <input
                  id="password"
                  type="password"
                  placeholder="••••••••"
                  required
                />
              </div>
            </div>

            <div class="show-password-container">
              <input type="checkbox" id="show-password" />
              <label for="show-password">Mostrar contraseña</label>
            </div>

            <button type="submit">
              <span>Entrar al sistema</span>
              <span class="material-symbols-outlined">login</span>
            </button>
          </form>

          <div class="auth-footer">
            ¿No tienes una cuenta?
            <a href="registroUsuario.html">Regístrate aquí</a>
          </div>
        </div>

        <p class="page-footer">
          © 2024 Health Tramiter. Todos los derechos reservados.
        </p>
      </main>
    </section>

    <script src="../js/main.js" type="module"></script>
    <script src="../js/md5.js"></script>
    <script src="../js/navegacion.js"></script>
  </body>
</html>
