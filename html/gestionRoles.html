<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Gestión de roles - Health Tramiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<section class="page-auth">
<div class="roles-box card-flush">

<div class="panel-header">
<div class="logo">
<img src="../imagenes/Logo.png" alt="Health Tramiter">
</div>
<h3 class="title-h3">Gestión de roles</h3>
<p class="subtitle">Asigna y administra los permisos de los usuarios</p>
</div>

<div class="panel-body-muted">
<form id="formRoles">

<div class="form-grid">
<div class="form-group">
<label for="rol">Rol</label>
<select id="rol" required>
<option value="">Seleccionar rol</option>
<option value="Administrador">Administrador</option>
<option value="Persona natural">Persona natural</option>
<option value="Auditor">Auditor</option>
</select>
</div>

<div class="form-group">
<label for="idUsuario">Correo electrónico</label>
<select id="idUsuario" required>
<option value="">Seleccionar usuario</option>
<option value="1">juan.perez@example.com</option>
<option value="2">maria.garcia@example.com</option>
</select>
</div>
</div>

<div class="roles-action">
<button type="submit">
<span class="material-symbols-outlined">person_add</span>
Asignar
</button>
</div>

</form>
</div>

<div class="panel-body">
<h4 class="section-caption">Usuarios Asignados</h4>

<div class="usuario-item">
<div class="usuario-item-info">
<div class="usuario-avatar">
<span class="material-symbols-outlined">person</span>
</div>
<div>
<p class="text-strong">Juan Pérez</p>
<p class="user-role">Persona natural</p>
</div>
</div>
<div class="buttons-roles compact-actions">
<button type="button" class="btn-secondary btn-editar compact-icon-button" title="Editar">
<span class="material-symbols-outlined">edit</span>
</button>
<button type="button" class="btn-secondary btn-eliminar compact-icon-button" title="Eliminar">
<span class="material-symbols-outlined">delete</span>
</button>
</div>
</div>

</div>

</div>
</section>

<script src="../js/main.js" type="module"></script>
<script src="../js/navegacion.js"></script>
</body>
</html>
