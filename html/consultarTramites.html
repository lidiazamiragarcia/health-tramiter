<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Consulta de trámites - Health Tramiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<section class="page-auth">
<div class="consulta-box">

<div class="logo">
<img src="../imagenes/Logo.png" alt="Health Tramiter">
</div>

<h3 class="title-h3">Consulta de trámites</h3>
<p class="subtitle">Busca y revisa el estado de tus solicitudes</p>

<form class="form-consulta">
<div class="form-group">
<label for="tipoConsulta">Seleccionar tipo de trámite</label>
<select id="tipoConsulta">
<option value="">Todos los trámites</option>
<option value="Cita médica" selected>Cita médica</option>
<option value="Autorización de exámenes">Autorización de exámenes</option>
<option value="Solicitud de medicamentos">Solicitud de medicamentos</option>
</select>
</div>
</form>

<div class="resultado-box">
<h4>Resultado encontrado</h4>
<div class="resultado-info">
<div class="resultado-row">
<span class="label">Tipo:</span>
<span>Cita médica</span>
</div>
<div class="resultado-row">
<span class="label">Fecha:</span>
<span>10/08/2025</span>
</div>
<div class="resultado-row">
<span class="label">Estado:</span>
<span class="badge badge-info">En proceso</span>
</div>
</div>
</div>

<table class="data-table" style="margin-top:1rem;display:none;" id="tablaTramitesWrap">
<thead>
<tr>
<th>ID</th>
<th>Tipo</th>
<th>EPS</th>
<th>Estado</th>
<th>Fecha</th>
</tr>
</thead>
<tbody id="tablaTramites"></tbody>
</table>

<div class="buttons-consulta">
<button type="button">
<span class="material-symbols-outlined">visibility</span>
Ver detalle
</button>
<button type="button">
<span class="material-symbols-outlined">add_circle</span>
Crear nuevo trámite
</button>
</div>

<div class="auth-footer">
<a href="dashboard.html">Volver al dashboard</a>
</div>

</div>
</section>

<script src="../js/navegacion.js"></script>
</body>
</html>
