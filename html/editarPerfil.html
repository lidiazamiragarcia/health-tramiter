<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Actualizar datos - Health Tramiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<section class="page-auth">
<div class="actualizarPerfil-box">

<div class="logo">
<img src="../imagenes/Logo.png" alt="Health Tramiter">
</div>

<h3 class="title-h3">Actualizar datos</h3>
<p class="subtitle">Mantén tu información personal al día</p>

<form id="formPerfil" class="form-grid">

<div class="form-group">
<label for="nombre">Nombres</label>
<input id="nombre" type="text" placeholder="Ej: Juan" required>
</div>

<div class="form-group">
<label for="apellido">Apellidos</label>
<input id="apellido" type="text" placeholder="Ej: Pérez" required>
</div>

<div class="form-group">
<label for="cedula">Cédula</label>
<input id="cedula" type="text" placeholder="Número de identificación">
</div>

<div class="form-group">
<label for="fechaNacimiento">Fecha de nacimiento</label>
<input id="fechaNacimiento" type="date">
</div>

<div class="form-group span-2">
<label for="direccion">Dirección</label>
<input id="direccion" type="text" placeholder="Calle, Ciudad, Provincia">
</div>

<div class="form-group">
<label for="telefono">Teléfono</label>
<input id="telefono" type="tel" placeholder="+593 99 999 9999">
</div>

<div class="form-group">
<label for="correo">Correo electrónico</label>
<input id="correo" type="email" placeholder="usuario@ejemplo.com" required>
</div>

<div class="form-group span-2">
<label for="passwordPerfil">Nueva contraseña (opcional)</label>
<input id="passwordPerfil" type="password" placeholder="********">
</div>

<button type="submit" style="grid-column:1/-1;">
<span class="material-symbols-outlined">save</span>
Actualizar datos
</button>

<p style="text-align:center;margin-top:0.5rem;">
<a href="dashboard.html" style="font-size:0.875rem;color:var(--on-surface-variant);">Cancelar y volver</a>
</p>

</form>

</div>
</section>

<script src="../js/main.js" type="module"></script>
<script src="../js/navegacion.js"></script>
</body>
</html>
