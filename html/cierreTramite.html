<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Cierre de trámite - Health Tramiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<section class="page-auth">
<div class="cierre-tramite-box card-flush">

<div class="panel-header panel-header-muted">
<div class="logo">
<img src="../imagenes/Logo.png" alt="Health Tramiter">
</div>
<h3 class="title-h3">Cierre de trámite</h3>
<p class="subtitle">Complete la resolución final del proceso</p>
</div>

<form id="formCierre" class="form-cierre-tramite panel-body">

<input type="hidden" id="idTramite" value="00012345">

<div class="form-grid">
<div class="form-group">
<label>Nº de Trámite</label>
<input type="text" value="00012345" readonly>
</div>
<div class="form-group">
<label>Usuario</label>
<input type="text" value="Juan Pérez" readonly>
</div>
</div>

<div class="form-group">
<label>Estado de la resolución</label>
<div class="estado-selector">
<div class="estado-option">
<input type="radio" name="estadoResolucion" id="aprobado" value="aprobado" checked>
<label for="aprobado" class="aprobado">
<span class="material-symbols-outlined">check_circle</span>
Aprobado
</label>
</div>
<div class="estado-option">
<input type="radio" name="estadoResolucion" id="rechazado" value="rechazado">
<label for="rechazado" class="rechazado">
<span class="material-symbols-outlined">cancel</span>
Rechazado
</label>
</div>
</div>
</div>

<div class="form-group">
<label for="observacion">Motivo y observaciones</label>
<textarea id="observacion" placeholder="Describa el motivo del estado seleccionado..." rows="4"></textarea>
</div>

<div class="buttons-cierre-tramite">
<button type="button" class="btn-cancelar">Cancelar</button>
<button type="submit">Finalizar Trámite</button>
</div>

</form>

<p class="page-footer">© 2024 Health Tramiter - Sistema de Gestión Interna</p>

</div>
</section>

<script src="../js/main.js" type="module"></script>
<script src="../js/navegacion.js"></script>
</body>
</html>
