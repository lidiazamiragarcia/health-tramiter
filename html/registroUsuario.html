<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Registro usuario - Health Tramiter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@300;400;600;700&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet">
<link rel="stylesheet" href="../css/estilo.css">
</head>
<body>

<section class="page-auth">
<main class="auth-shell">
<div class="auth-header">
<div class="logo">
<img src="../imagenes/Logo.png" alt="Health Tramiter">
</div>
<h1 class="title-h1">Health Tramiter</h1>
<p class="subtitle">Tu salud, tus documentos</p>
</div>

<div class="auth-card registroUsuario-box">

<h3 class="title-h3">Registro de usuario</h3>
<p class="subtitle">Crea tu cuenta para gestionar tus trámites de salud</p>

<form id="formRegistro" class="form-registro">

<div class="form-grid">

<div class="form-group">
<label for="nombre">Nombres</label>
<input id="nombre" type="text" placeholder="Ej. Juan Andrés" required>
</div>

<div class="form-group">
<label for="apellido">Apellidos</label>
<input id="apellido" type="text" placeholder="Ej. Pérez García" required>
</div>

<div class="form-group">
<label for="cedula">Cédula</label>
<input id="cedula" type="text" placeholder="0000000000">
</div>

<div class="form-group">
<label for="fechaNacimiento">Fecha de nacimiento</label>
<input id="fechaNacimiento" type="date">
</div>

<div class="form-group span-2">
<label for="direccion">Dirección</label>
<input id="direccion" type="text" placeholder="Calle principal #123, Ciudad">
</div>

<div class="form-group">
<label for="telefono">Celular</label>
<input id="telefono" type="tel" placeholder="0999999999">
</div>

<div class="form-group">
<label for="correo">Correo electrónico</label>
<input id="correo" type="email" placeholder="usuario@correo.com" required>
</div>

<div class="form-group span-2">
<label for="password">Contraseña</label>
<input id="password" type="password" placeholder="••••••••" required>
<small class="text-helper">Debe tener al menos 4 caracteres</small>
</div>

<div class="form-group span-2">
<label for="confirmarPassword">Confirmar contraseña</label>
<input id="confirmarPassword" type="password" placeholder="••••••••" required>
</div>

</div>

<button type="submit" class="btn-registro">
<span class="material-symbols-outlined">person_add</span>
Registrarse
</button>

</form>

<div class="auth-footer">
<span>¿Ya tiene cuenta?</span>
<a href="login.html">iniciar sesión</a>
</div>

</div>
<p class="page-footer">© 2024 Health Tramiter. Todos los derechos reservados.</p>
</main>
</section>

<script src="../js/main.js" type="module"></script>
<script src="../js/md5.js"></script>
<script src="../js/navegacion.js"></script>
</body>
</html>
